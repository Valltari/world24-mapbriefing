<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>World24 · Map Briefing</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 72% 18%, #173d69 0, #071427 38%, #020711 78%);
      color: #f4f7ff;
    }
    main {
      width: min(460px, 100%);
      padding: 42px 38px 38px;
      border: 1px solid rgba(126, 177, 255, .34);
      background: rgba(3, 10, 24, .95);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .55);
      text-align: center;
    }
    .kicker { margin: 0 0 12px; color: #75b2ff; font-size: 13px; font-weight: 800; letter-spacing: .13em; }
    h1 { margin: 0; font-size: 30px; line-height: 1.3; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 28px auto 22px;
      border: 4px solid rgba(117, 178, 255, .22);
      border-top-color: #75b2ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    p { margin: 0; color: #b4c2d7; font-size: 15px; line-height: 1.65; }
    .error { color: #ffd15c; }
    button {
      display: none;
      width: 100%;
      height: 52px;
      margin-top: 24px;
      border: 0;
      background: #ffd15c;
      color: #14191f;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #ffdb7d; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">World24 · Map Briefing</p>
    <h1>World24로 연결 중입니다</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">현재 운영 주소를 확인하고 있습니다.</p>
    <button id="open" type="button">World24 열기</button>
  </main>
  <script>
    const endpoint = 'https://api.github.com/repos/Valltari/world24-mapbriefing/contents/current.json?ref=main';
    const status = document.querySelector('#status');
    const openButton = document.querySelector('#open');
    let targetUrl = '';

    function decodeBase64Utf8(value) {
      const binary = atob(value.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function isAllowedTarget(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' &&
          (url.hostname.endsWith('.trycloudflare.com') || url.hostname === 'trycloudflare.com');
      } catch {
        return false;
      }
    }

    async function connect() {
      try {
        const response = await fetch(endpoint, {
          cache: 'no-store',
          headers: { Accept: 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(`GitHub response ${response.status}`);
        const file = await response.json();
        const current = JSON.parse(decodeBase64Utf8(file.content));
        if (!isAllowedTarget(current.url)) throw new Error('Invalid World24 address');
        targetUrl = current.url;
        status.textContent = '운영 중인 World24 화면으로 이동합니다.';
        window.location.replace(targetUrl);
      } catch {
        document.querySelector('.spinner').style.display = 'none';
        status.className = 'error';
        status.textContent = '현재 World24 서버 주소를 확인하지 못했습니다. 잠시 후 다시 시도해주세요.';
        openButton.style.display = targetUrl ? 'block' : 'none';
      }
    }

    openButton.addEventListener('click', () => {
      if (targetUrl) window.location.assign(targetUrl);
    });
    connect();
  </script>
</body>
</html>
